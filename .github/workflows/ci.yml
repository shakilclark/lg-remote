name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Test + screenshot-verify + lint + assemble
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug lintDebug assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Roborazzi diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
