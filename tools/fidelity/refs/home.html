<!-- Fidelity ref: HOME surface, full-bleed 411x1200, Ultraviolet LIGHT (dynamic-off fallback the
     golden renders on). The clickpad (spec 022): recessed well with a centre OK ring, four recessed
     directional chevrons, and four corner actions (TL Settings, TR Mute, BL Back, BR Home). Volume is
     on the hardware buttons (no on-screen rail). Hints recessed at rest. Background = surface #FDF7FF. -->
<style>
  :root{
    --surf:#FDF7FF;--sc:#EFE3F8;--sc-high:#E9DDF4;
    --on:#1D1B20;--onv:#4A454E;--outline:#7B757F;
    --p:#6E2EC9;--op:#FFFFFF;--ok-c:#2E7D4F;
  }
  *{box-sizing:border-box;margin:0;}
  html,body{width:411px;height:1200px;background:var(--surf);font-family:system-ui,-apple-system,sans-serif;color:var(--on);}
  .col{display:flex;flex-direction:column;height:1200px;}

  .appbar{display:flex;align-items:center;gap:8px;padding:8px 16px;}
  .tvchip{display:inline-flex;align-items:center;gap:8px;background:var(--sc-high);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:600;color:var(--on);flex:1;}
  .tvchip .live{width:8px;height:8px;border-radius:50%;background:var(--ok-c);flex:none;}
  .ib{width:44px;height:40px;border-radius:20px;display:grid;place-items:center;font-size:16px;flex:none;border:none;}
  .ib.mic{background:var(--sc-high);color:var(--onv);opacity:.5;}
  .ib.pw{background:var(--sc-high);color:var(--on);}

  .pad{flex:1;margin:8px 16px;border-radius:28px;position:relative;display:grid;place-items:center;overflow:hidden;
    background:
      repeating-linear-gradient(45deg, color-mix(in srgb,var(--on) 5%, transparent) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, color-mix(in srgb,var(--on) 5%, transparent) 0 1px, transparent 1px 6px),
      radial-gradient(135% 118% at 50% 36%, #FFFFFF 0%, var(--sc) 58%, color-mix(in srgb,var(--on) 11%, var(--sc)) 100%);
    box-shadow:inset 0 7px 15px -9px rgba(70,40,110,.30), inset 0 -2px 7px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.85);
    border:1px solid color-mix(in srgb,var(--on) 10%, transparent);}
  .ring{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;
    background:linear-gradient(180deg,#f2ebf9,#e9ddf4 55%,#e1d4ee);color:#4A454E;
    box-shadow:0 2px 4px -3px rgba(70,40,110,.30), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(70,40,110,.12);}
  /* recessed hints (faint at rest) */
  .ch{position:absolute;color:var(--onv);opacity:.16;font-size:22px;}
  .ch.up{top:12px;left:50%;transform:translateX(-50%)} .ch.dn{bottom:12px;left:50%;transform:translateX(-50%)}
  .ch.lf{left:14px;top:50%;transform:translateY(-50%)} .ch.rt{right:14px;top:50%;transform:translateY(-50%)}
  .corner{position:absolute;color:var(--onv);opacity:.16;font-size:20px;}
  .tl{top:12px;left:14px} .tr{top:12px;right:14px} .bl{bottom:12px;left:14px} .br{bottom:12px;right:14px}

  .grip{padding:10px 0 14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--onv);font-size:12px;}
  .grip .bar{width:40px;height:5px;border-radius:999px;background:var(--outline);}
</style>
<div class="col">
  <div class="appbar">
    <span class="tvchip"><span class="live"></span>TV</span>
    <button class="ib mic"></button>
    <button class="ib pw">&#9211;</button>
  </div>
  <div class="pad">
    <span class="ch up">&#9650;</span>
    <span class="ch dn">&#9660;</span>
    <span class="ch lf">&#9664;</span>
    <span class="ch rt">&#9654;</span>
    <span class="corner tl">&#9881;</span>
    <span class="corner tr">&#128263;</span>
    <span class="corner bl">&#8592;</span>
    <span class="corner br">&#8962;</span>
    <span class="ring">OK</span>
  </div>
  <div class="grip"><span class="bar"></span>More controls</div>
</div>
