<!-- Fidelity ref: NOW-PLAYING COVER, full-bleed 411x333, Ultraviolet light, de-noised. -->
<style>
  :root{--surf:#FDF7FF;--sc:#EFE3F8;--sc-high:#E9DDF4;--on:#1D1B20;--onv:#4A454E;--p:#6E2EC9;--op:#FFFFFF;--scon:#ECDDFB;--oscon:#211A2C;}
  *{box-sizing:border-box;margin:0;}
  html,body{width:411px;height:333px;background:var(--surf);font-family:system-ui,sans-serif;}
  .cover{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 16px;}
  .tile{width:120px;height:120px;border-radius:28px;background:var(--sc-high);}
  .ttl{font-size:19px;font-weight:700;color:var(--on);}
  .state{font-size:13px;color:var(--onv);}
  .trans{display:flex;gap:16px;}
  .k{width:60px;height:60px;border-radius:20px;background:var(--sc);}
  .k.play{background:var(--p);}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--scon);color:var(--oscon);border-radius:999px;padding:8px 14px;font-size:13px;opacity:.55;}
</style>
<div class="cover">
  <div class="tile"></div>
  <div class="ttl">YouTube</div>
  <div class="state">Playing</div>
  <div class="trans"><span class="k"></span><span class="k play"></span><span class="k"></span><span class="k"></span></div>
  <span class="chip">Output</span>
</div>
